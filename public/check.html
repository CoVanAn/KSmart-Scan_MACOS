      const rows = document.getElementById('rows');
      const row = (k, v, cls) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${k}</td><td class="${cls || ''}">${v}</td>`;
        rows.append(tr);
      };
      const yn = (b) => (b ? ['có', 'ok'] : ['KHÔNG', 'no']);

      const verdict = (cls, text, sub) => {
        const el = document.getElementById('verdict');
        el.className = 'verdict ' + cls;
        el.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
      };

      document.getElementById('ua').textContent = navigator.userAgent;

      const CODECS = ['avc1.42c01e', 'avc1.42c01f', 'avc1.4d401f', 'avc1.64001f'];

      (async () => {
        const hasMse = typeof window.MediaSource !== 'undefined';
        row('MediaSource (MSE)', ...(([t, c]) => [t, c])(yn(hasMse)));
        row('ManagedMediaSource (Safari iOS 17.1+)', ...(([t, c]) => [t, c])(yn(typeof window.ManagedMediaSource !== 'undefined')));
        row('WebSocket', ...(([t, c]) => [t, c])(yn(typeof window.WebSocket !== 'undefined')));

        if (!hasMse) {
          verdict('fail', 'Không xem được video', 'Trình duyệt không có Media Source Extensions.');
          return;
        }

        let anyCodec = false;
        for (const c of CODECS) {
          const ok = MediaSource.isTypeSupported(`video/mp4; codecs="${c}"`);
          anyCodec = anyCodec || ok;
          row(`MSE hỗ trợ <code>${c}</code>`, ...(([t, cl]) => [t, cl])(yn(ok)));
        }

        if (!anyCodec) {
          verdict('fail', 'Không xem được video',
            'API MSE có nhưng không giải mã được H.264. Trên Linux thường là do thiếu gói <code>gstreamer1.0-libav</code>.');
          return;
        }

        // Phep thu THAT: nap clip vao MSE va dem khung hinh giai ma duoc.
        // Chi kiem tra API la khong du - da gap truong hop API bao co ma decode van hong.
        const bytes = Uint8Array.from(atob(CLIP_B64), (ch) => ch.charCodeAt(0));
        const video = document.getElementById('v');
        const ms = new MediaSource();
        video.src = URL.createObjectURL(ms);

        const result = await new Promise((resolve) => {
          const timer = setTimeout(() => resolve({ ok: false, why: 'hết thời gian chờ' }), 10000);
          ms.addEventListener('sourceopen', () => {
            let sb;
            try {
              sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42c01e"');
            } catch (e) {
              clearTimeout(timer);
              return resolve({ ok: false, why: 'không tạo được SourceBuffer: ' + e.message });
            }
            video.addEventListener('error', () => {
              clearTimeout(timer);
              resolve({ ok: false, why: 'lỗi giải mã: ' + (video.error?.message || 'không rõ') });
            });
            sb.addEventListener('updateend', () => {
              video.play().catch(() => {});
              setTimeout(() => {
                clearTimeout(timer);
                const q = video.getVideoPlaybackQuality?.() || {};
                resolve({
                  ok: video.videoWidth > 0,
                  w: video.videoWidth, h: video.videoHeight,
                  frames: q.totalVideoFrames ?? null,
                  corrupted: q.corruptedVideoFrames ?? null,
                });
              }, 2500);
            });
            try {
              sb.appendBuffer(bytes);
            } catch (e) {
              clearTimeout(timer);
              resolve({ ok: false, why: 'appendBuffer lỗi: ' + e.message });
            }
          });
        });

        row('Nạp clip thật vào MSE', result.ok ? 'THÀNH CÔNG' : 'THẤT BẠI', result.ok ? 'ok' : 'no');
        if (result.ok) {
          row('Kích thước giải mã được', `${result.w}×${result.h}`, 'ok');
          if (result.frames !== null) row('Số khung hình đã decode', `${result.frames} (hỏng: ${result.corrupted})`, 'ok');
          verdict('pass', '✓ Trình duyệt này xem được camera',
            'Đã giải mã thật khung hình H.264 qua MSE. Tauri/Electron dùng webview này sẽ chạy được.');
        } else {
          row('Lý do', result.why || '—', 'no');
          verdict('fail', '✗ Không xem được video',
            'MSE báo hỗ trợ codec nhưng giải mã thất bại: ' + (result.why || '') +
            '. Với webview này cần chuyển sang WebRTC (go2rtc / MediaMTX).');
        }
      })();
